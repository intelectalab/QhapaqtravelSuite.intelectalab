# Qhapaq Travel Suite — entorno local de desarrollo.
# Ubicación esperada: raíz del espacio de trabajo, junto a backend/ y web/.
#   cp docs/kit/infra/docker-compose.yml . && cp -r docs/kit/infra/docker .
# Servicios: api (php-fpm 8.4) + nginx, queue (Horizon), scheduler, reverb, web (Next.js),
#            postgres 17, redis 8, minio (S3), mailpit (correo).
name: qhapaq

x-php: &php
  build: { context: ./docker/php }
  image: qhapaq/php:8.4
  working_dir: /var/www/backend
  volumes: [ "./backend:/var/www/backend" ]
  env_file: [ ./backend/.env ]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  api:
    <<: *php
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/status SCRIPT_FILENAME=/status REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 >/dev/null || exit 1"]
      interval: 10s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports: [ "8000:80" ]
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ api ]

  queue:
    <<: *php
    command: php artisan horizon
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: [ "8080:8080" ]
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    volumes: [ "./web:/app", "web_node_modules:/app/node_modules" ]
    env_file: [ ./web/.env.local ]
    ports: [ "3000:3000" ]
    depends_on: [ nginx ]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: qhapaq
      POSTGRES_USER: qhapaq_owner          # dueño del esquema: SOLO para migraciones
      POSTGRES_PASSWORD: owner_local_only
    ports: [ "5432:5432" ]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qhapaq_owner -d qhapaq"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports: [ "6379:6379" ]
    volumes: [ "redis_data:/data" ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_local_only
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "minio_data:/data" ]

  minio-init:
    image: minio/mc:latest
    depends_on: [ minio ]
    entrypoint: >
      sh -c "sleep 3 &&
             mc alias set local http://minio:9000 minio minio_local_only &&
             mc mb -p local/qhapaq-private local/qhapaq-public &&
             mc anonymous set download local/qhapaq-public"

  mailpit:
    image: axllent/mailpit:latest
    ports: [ "8025:8025", "1025:1025" ]

volumes:
  pg_data:
  redis_data:
  minio_data:
  web_node_modules:
