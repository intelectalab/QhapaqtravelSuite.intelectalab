map $http_upgrade $kipucontrol_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMINIO__;

    ssl_certificate /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;

    client_max_body_size 30M;
    access_log /var/log/nginx/kipucontrol.access.log;
    error_log /var/log/nginx/kipucontrol.error.log;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_read_timeout 90s;
    }

    location ~ ^/(app|apps)/ {
        proxy_pass http://127.0.0.1:__REVERB_HOST_PORT__;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kipucontrol_connection;
        proxy_read_timeout 3600s;
    }

    location /almacen/ {
        proxy_pass http://127.0.0.1:__STORAGE_PORT__/;
        proxy_set_header Host storage:9000;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kipucontrol_connection;
        proxy_read_timeout 90s;
    }
}
