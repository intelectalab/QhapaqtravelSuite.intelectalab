# Qhapaq Travel Suite — entorno local de desarrollo.
# Ubicación esperada: raíz del espacio de trabajo, junto a backend/ y web/.
#   cp docs/kit/infra/docker-compose.yml . && cp -r docs/kit/infra/docker .
# Servicios: api (php-fpm 8.4) + nginx, queue (Horizon), scheduler, reverb, web (Next.js),
#            postgres 17, redis 8, storage (S3, RustFS), mailpit (correo).
name: qhapaq

x-php: &php
  build: { context: ./docker/php }
  image: qhapaq/php:8.4
  working_dir: /var/www/backend
  volumes: [ "./backend:/var/www/backend", "./docs:/var/www/docs:ro" ]
  env_file: [ ./backend/.env ]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  api:
    <<: *php
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/status SCRIPT_FILENAME=/status REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 >/dev/null || exit 1"]
      interval: 10s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports: [ "8000:80" ]
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ api ]

  queue:
    <<: *php
    user: "1000:1000"
    command: php artisan horizon
    restart: unless-stopped

  scheduler:
    <<: *php
    user: "1000:1000"
    command: php artisan schedule:work
    restart: unless-stopped

  reverb:
    <<: *php
    user: "1000:1000"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: [ "8080:8080" ]
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    volumes: [ "./web:/app", "web_node_modules:/app/node_modules" ]
    env_file: [ ./web/.env.local ]
    ports: [ "3000:3000" ]
    depends_on: [ nginx ]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: qhapaq
      POSTGRES_USER: qhapaq_owner          # dueño del esquema: SOLO para migraciones
      POSTGRES_PASSWORD: owner_local_only
    ports: [ "5432:5432" ]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qhapaq_owner -d qhapaq"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports: [ "6379:6379" ]
    volumes: [ "redis_data:/data" ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: storage
      RUSTFS_SECRET_KEY: storage_local_only
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "storage_data:/data" ]

  storage-init:
    image: amazon/aws-cli:latest
    depends_on: [ storage ]
    environment:
      AWS_ACCESS_KEY_ID: storage
      AWS_SECRET_ACCESS_KEY: storage_local_only
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >-
        sleep 4;
        for b in qhapaq-private qhapaq-public; do aws --endpoint-url http://storage:9000 s3 mb "s3://$$b" || true; done;
        aws --endpoint-url http://storage:9000 s3api put-bucket-policy --bucket qhapaq-public --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::qhapaq-public/*"}]}';
        aws --endpoint-url http://storage:9000 s3 ls

  mailpit:
    image: axllent/mailpit:latest
    ports: [ "8025:8025", "1025:1025" ]

volumes:
  pg_data:
  redis_data:
  storage_data:
  web_node_modules:
