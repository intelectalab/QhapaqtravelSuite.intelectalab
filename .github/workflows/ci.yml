# Copiar a .github/workflows/ci.yml en cada repositorio (o en el monorepo).
# Supone la estructura: backend/, web/, docs/ (con docs/kit).
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qhapaq_test
          POSTGRES_USER: qhapaq_owner
          POSTGRES_PASSWORD: owner_ci
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U qhapaq_owner -d qhapaq_test"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:8
        ports: [ "6379:6379" ]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: qhapaq_test
      DB_USERNAME: qhapaq_app
      DB_PASSWORD: app_ci
      DB_PLATFORM_USERNAME: qhapaq_platform
      DB_PLATFORM_PASSWORD: platform_ci
      DB_OWNER_USERNAME: qhapaq_owner
      DB_OWNER_PASSWORD: owner_ci
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      FISCAL_GATEWAY: fake
      PAYMENT_GATEWAY: fake
      MESSAGING_CHANNEL: fake
      REVIEWS_PROVIDER: fake
      FX_RATE_PROVIDER: fake
      PUSH_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, gd, zip
          coverage: none
      - name: Roles de conexión (sin BYPASSRLS)
        env: { PGPASSWORD: owner_ci }
        run: |
          psql -h 127.0.0.1 -U qhapaq_owner -d qhapaq_test -v ON_ERROR_STOP=1 <<'SQL'
          create role app_role nologin nobypassrls;
          create role platform_role nologin nobypassrls;
          create role qhapaq_app login password 'app_ci' in role app_role;
          create role qhapaq_platform login password 'platform_ci' in role platform_role;
          SQL
      - run: composer install --no-interaction --prefer-dist
      - name: Dependencias PHP sin vulnerabilidades conocidas
        run: composer audit --no-interaction --locked
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --memory-limit=1G
      - run: php artisan migrate --database=pgsql_owner --force
      - run: ./vendor/bin/pest --parallel
      - run: php artisan qa:write-coverage
      - name: Contrato OpenAPI
        run: |
          pip install pyyaml
          php -d memory_limit=2G artisan scramble:export --path=storage/openapi.generated.json
          python3 ../docs/kit/api/compare_contract.py storage/openapi.generated.json --phase "${{ vars.QHAPAQ_PHASE || '0' }}"

  database-kit:
    runs-on: ubuntu-latest
    if: contains(join(github.event.commits.*.modified, ','), 'docs/kit/database') || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 (binarios)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
      - run: PGBIN=/usr/lib/postgresql/17/bin bash docs/kit/database/tests/validate.sh
      - run: pip install pyyaml openapi-spec-validator && python3 docs/kit/api/build_openapi.py --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Dependencias de la web sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
      - run: npm run api:gen && git diff --exit-code -- src/lib/api   # el cliente tipado debe estar al día con el contrato
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [ backend, web ]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Stack completo
        run: |
          cp docs/kit/infra/docker-compose.yml . && cp -r docs/kit/infra/docker .
          cp docs/kit/infra/env/backend.env.example backend/.env
          cp docs/kit/infra/env/web.env.example web/.env.local
          docker compose up -d --build --wait
          docker compose exec -T api composer install --no-interaction
          docker compose exec -T api php artisan key:generate
          docker compose exec -T api php artisan migrate:fresh --database=pgsql_owner --seed --seeder='Database\Seeders\E2ESeeder'
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: docs/kit/tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          cp .env.example .env
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: docs/kit/tests/e2e/playwright-report
